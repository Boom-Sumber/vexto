[package]
name = "lightbox"
version = "0.3.9"
description = "轻量工具集：划词翻译 / 截图翻译 / 下载 / 局域网传文件"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 全局热键。库本身不限修饰键数量、也不限「只准 Ctrl/Shift/Alt」，
# 规格由 src/hotkey.rs 的 validate_hotkey() 守（见 ADR-018）。
tauri-plugin-global-shortcut = "2"

# 下载完成 / 失败的系统通知（S3.5）。用官方插件而不是手写 Win32 Toast：
# 后者要处理 COM 激活、快捷方式与 AUMID，代码量远大于一个依赖。
tauri-plugin-notification = "2"

# 单实例（S6）：第二个实例唤起已有进程。必须第一个注册。
tauri-plugin-single-instance = "2"

# 百度翻译（S1b 用）。必须 native-tls：rustls 会拉 aws-lc-sys，要 CMake/NASM，
# 本机编不过（09-MVP-BASELINE §9.6 坑 1）。
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "form",
    "json",
    "native-tls",
    # GitHub 解析要复用下载代理；用户常填 socks5（Clash 默认），没有这个
    # feature 时 Proxy::all 接得住但连接时才失败。
    "socks",
] }
md-5 = "0.11"

# 接收页要显示「主机地址：192.168.x.x」。lanflare 内部已经用它枚举网卡，
# 这里只是把它提到直接依赖，不新增下载。
if-addrs = "0.13"
# 有道智云 v3 签名要 sha256（`sha256(appKey+input+salt+curtime+密钥)`）。
# 与 md-5 同属 RustCrypto，digest trait 已经在依赖树里，只是多一个小 crate。
sha2 = "0.10"

# S4 局域网互传（LocalSend v2.2 互操作，ADR-010）：协议实现用 lanflare-core，
# 外面按 ADR-010 包一层 transfer::backend::TransferBackend trait，将来换自研
# 实现只改 transfer/server.rs。两个 crate 均为 Apache-2.0，TLS 走 rustls（纯
# Rust 自签证书 rcgen），不引 openssl（03 §3.2 禁 CMake/NASM -sys，07-LICENSING）。
lanflare-core = "0.5"
lanflare-proto = "0.5"
# transfer/server.rs 自建一个 2 worker 的 tokio 运行时跑发现与 HTTP 服务，
# 不占用 Tauri 的 async_runtime；lanflare-core 内部就是 tokio 生态。
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync"] }
# 发送侧取消令牌（TransferOptions::cancel_token 的类型），lanflare 同款。
tokio-util = "0.7"

# 本地语种检测（S2.5 用）。MIT 许可（不是 GPL，符合 07-LICENSING）。
# 选它而不是 lingua：whatlang 无外部数据文件、编译产物小，lingua 会带 ~50 MB 语料。
whatlang = "0.18"

# 取词（S1b 用）：剪贴板兜底 + UIA 路线。
arboard = "3"
uiautomation = "0.25"

# S5 OCR：AsyncStatus 类型 + OcrEngine 轮询等待。版本必须跟 windows crate
# 内部用的对齐（0.62 → windows-future 0.3）。
windows-future = "0.3"

# S7 截图：PNG 编码。`png 0.18.1` 本来就在依赖树里（tauri 的 image-png /
# image 传递依赖），这里只是提升为直接依赖，**不新增下载**（ADR-040）。
# 长图用 `Writer::stream_writer()` 逐行写，不用 image 的整图编码 API。
png = "0.18"
# 截图文件名 `$uuid$` 格式（会话 81）。lanflare 已传递依赖 uuid，
# 这里只把它提升为直接依赖并开 v4，不新增下载。
uuid = { version = "1", features = ["v4"] }

# ── 实验分支 exp/ocr-paddle：PaddleOCR ONNX（只在本分支，不合并 main）──
pure-onnx-ocr = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }

windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # DwmGetWindowAttribute(DWMWA_EXTENDED_FRAME_BOUNDS)：活动窗口截图去掉
    # 不可见阴影的边界（S7）。同一个 windows crate，只开 feature，不新增下载。
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    # GetLocalTime：截图文件名用本地时间（S7），不引 chrono。
    "Win32_System_SystemInformation",
    # PrintWindow(PW_RENDERFULLCONTENT)：活动窗口截图（S7）。windows 0.62 把
    # PrintWindow 绑在 Xps 模块下；只开 feature，不新增下载。
    "Win32_Storage_Xps",
    # SHGetKnownFolderPath(FOLDERID_Downloads)：取系统真实的「下载」文件夹。
    # 不能直接拼 %USERPROFILE%\Downloads —— 用户可能把下载文件夹重定向到 D 盘。
    "Win32_UI_Shell",
    # GetOpenFileNameW：发送文件的系统文件选择框（S4b），commdlg 在 Controls::Dialogs。
    "Win32_UI_Controls_Dialogs",
    # GetDiskFreeSpaceExW：新建任务页显示「可用 153.3 GB」。
    "Win32_Storage_FileSystem",
    # RegGetValueW：读 WinINET 的系统代理设置（代理模式选「跟随系统」时用）。
    "Win32_System_Registry",
    # RegCreateKeyExW 被 gate 在 Win32_Security 下（开机自启要创建 Run 键）。
    # 只放开绑定，不引入新 crate。
    "Win32_Security",
    # MultiByteToWideChar：文件名不是 UTF-8 时按系统 ANSI 代码页（简中为 936）
    # 兜底解码，否则中文站点给的百分号文件名会变成一串 U+FFFD。
    "Win32_Globalization",
    # ── WinRT（S5 OCR）：Windows.Media.Ocr 系统自带识别引擎（离线，中文要语言包）
    # + SoftwareBitmap / DataWriter 传像素 + Globalization 列可用语言。
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
] }

# release profile 在 workspace 根 Cargo.toml —— 写在成员包里不生效。
