[package]
name = "lightbox"
version = "0.1.0"
description = "轻量工具集：划词翻译 / 截图翻译 / 下载 / 局域网传文件"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 全局热键。库本身不限修饰键数量、也不限「只准 Ctrl/Shift/Alt」，
# 规格由 src/hotkey.rs 的 validate_hotkey() 守（见 ADR-018）。
tauri-plugin-global-shortcut = "2"

# 下载完成 / 失败的系统通知（S3.5）。用官方插件而不是手写 Win32 Toast：
# 后者要处理 COM 激活、快捷方式与 AUMID，代码量远大于一个依赖。
tauri-plugin-notification = "2"

# 百度翻译（S1b 用）。必须 native-tls：rustls 会拉 aws-lc-sys，要 CMake/NASM，
# 本机编不过（09-MVP-BASELINE §9.6 坑 1）。
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "form",
    "json",
    "native-tls",
] }
md-5 = "0.11"

# 本地语种检测（S2.5 用）。MIT 许可（不是 GPL，符合 07-LICENSING）。
# 选它而不是 lingua：whatlang 无外部数据文件、编译产物小，lingua 会带 ~50 MB 语料。
whatlang = "0.18"

# 取词（S1b 用）：剪贴板兜底 + UIA 路线。
arboard = "3"
uiautomation = "0.25"

windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    # SHGetKnownFolderPath(FOLDERID_Downloads)：取系统真实的「下载」文件夹。
    # 不能直接拼 %USERPROFILE%\Downloads —— 用户可能把下载文件夹重定向到 D 盘。
    "Win32_UI_Shell",
    # GetDiskFreeSpaceExW：新建任务页显示「可用 153.3 GB」。
    "Win32_Storage_FileSystem",
    # RegGetValueW：读 WinINET 的系统代理设置（代理模式选「跟随系统」时用）。
    "Win32_System_Registry",
    # RegCreateKeyExW 被 gate 在 Win32_Security 下（开机自启要创建 Run 键）。
    # 只放开绑定，不引入新 crate。
    "Win32_Security",
    # MultiByteToWideChar：文件名不是 UTF-8 时按系统 ANSI 代码页（简中为 936）
    # 兜底解码，否则中文站点给的百分号文件名会变成一串 U+FFFD。
    "Win32_Globalization",
] }

# release profile 在 workspace 根 Cargo.toml —— 写在成员包里不生效。
