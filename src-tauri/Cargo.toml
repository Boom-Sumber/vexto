[package]
name = "lightbox"
version = "0.1.0"
description = "轻量工具集：划词翻译 / 截图翻译 / 下载 / 局域网传文件"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 全局热键。库本身不限修饰键数量、也不限「只准 Ctrl/Shift/Alt」，
# 规格由 src/hotkey.rs 的 validate_hotkey() 守（见 ADR-018）。
tauri-plugin-global-shortcut = "2"

# 百度翻译（S1b 用）。必须 native-tls：rustls 会拉 aws-lc-sys，要 CMake/NASM，
# 本机编不过（09-MVP-BASELINE §9.6 坑 1）。
reqwest = { version = "0.13", default-features = false, features = [
    "blocking",
    "form",
    "json",
    "native-tls",
] }
md-5 = "0.11"

# 本地语种检测（S2.5 用）。MIT 许可（不是 GPL，符合 07-LICENSING）。
# 选它而不是 lingua：whatlang 无外部数据文件、编译产物小，lingua 会带 ~50 MB 语料。
whatlang = "0.18"

# 取词（S1b 用）：剪贴板兜底 + UIA 路线。
arboard = "3"
uiautomation = "0.25"

windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    # SHGetKnownFolderPath(FOLDERID_Downloads)：取系统真实的「下载」文件夹。
    # 不能直接拼 %USERPROFILE%\Downloads —— 用户可能把下载文件夹重定向到 D 盘。
    "Win32_UI_Shell",
] }

# release profile 在 workspace 根 Cargo.toml —— 写在成员包里不生效。
