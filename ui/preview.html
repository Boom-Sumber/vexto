<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>截图预览</title>
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="theme-dark.css" />
<link rel="stylesheet" href="theme-light.css" />
<link rel="stylesheet" href="base.css" />
<link rel="stylesheet" href="annot_editor.css" />
<link rel="stylesheet" href="preview.css" />
</head>
<body data-theme="dark">
<div class="win">
  <!-- 自绘标题栏：与设置 / 主窗口同一套组件（docs/13-UI-DESIGN-SYSTEM.md） -->
  <header class="tb" data-tauri-drag-region>
    <span class="tb-title" data-tauri-drag-region>截图预览</span>
    <div class="tb-actions">
      <button class="tb-btn" type="button" data-win="min"></button>
      <button class="tb-btn" type="button" data-win="max"></button>
      <button class="tb-btn close" type="button" data-win="close"></button>
    </div>
  </header>

  <div class="pv-head">
    <span id="pv-info" class="pv-info">正在读取…</span>
    <span class="pv-hint">拖动滑块裁掉头尾，右侧按钮只作用于裁切后的区域</span>
  </div>

  <div id="pv-edit-bar" class="pv-edit-bar">
    <button id="pv-tool-move" class="tb-btn pv-tool on" type="button" data-tool="" title="选择（不标注）"></button>
    <span class="pv-edit-sep"></span>
    <button class="tb-btn pv-tool" type="button" data-tool="rect" title="矩形"></button>
    <button class="tb-btn pv-tool" type="button" data-tool="ellipse" title="椭圆"></button>
    <button class="tb-btn pv-tool" type="button" data-tool="arrow" title="箭头"></button>
    <button class="tb-btn pv-tool" type="button" data-tool="pen" title="画笔"></button>
    <button class="tb-btn pv-tool" type="button" data-tool="text" title="文字"></button>
    <button class="tb-btn pv-tool" type="button" data-tool="mosaic" title="马赛克"></button>
    <span class="pv-edit-sep"></span>
    <span id="pv-edit-hint" class="pv-edit-hint">选择工具后在图上拖动标注</span>
  </div>

  <main class="pv-main">
    <div class="pv-viewport-wrap">
      <div class="pv-viewport">
        <div id="pv-canvas" class="pv-canvas">
          <img id="pv-img" alt="" draggable="false" />
          <canvas id="pv-annot" class="pv-annot"></canvas>
          <div id="pv-band-top" class="pv-band top"></div>
          <div id="pv-band-bottom" class="pv-band bottom"></div>
          <div id="pv-band-left" class="pv-band left"></div>
          <div id="pv-band-right" class="pv-band right"></div>
        </div>
      </div>
      <div class="pv-zoom">
        <button id="pv-zoom-out" class="tb-btn" type="button" title="缩小"></button>
        <button id="pv-zoom-in" class="tb-btn" type="button" title="放大"></button>
      </div>
    </div>

    <aside class="pv-side">
      <div class="pv-field">
        <div class="pv-label"><span>裁掉顶部</span><span id="pv-head-v">0 px</span></div>
        <input id="pv-head" type="range" min="0" max="0" value="0" step="1" />
      </div>
      <div class="pv-field">
        <div class="pv-label"><span>裁掉底部</span><span id="pv-tail-v">0 px</span></div>
        <input id="pv-tail" type="range" min="0" max="0" value="0" step="1" />
      </div>
      <div class="pv-field">
        <div class="pv-label"><span>裁掉左侧</span><span id="pv-left-v">0 px</span></div>
        <input id="pv-left" type="range" min="0" max="0" value="0" step="1" />
      </div>
      <div class="pv-field">
        <div class="pv-label"><span>裁掉右侧</span><span id="pv-right-v">0 px</span></div>
        <input id="pv-right" type="range" min="0" max="0" value="0" step="1" />
      </div>
      <p class="pv-hint">拖动滑块裁掉边缘；下面的按钮只作用于裁切后的区域。</p>

      <div class="pv-field">
        <div class="pv-label"><span>保存目录</span></div>
        <div class="pv-path-row">
          <input id="pv-dir" type="text" readonly />
          <button id="pv-open-dir" class="btn icon-btn" type="button" title="打开资源管理器"></button>
        </div>
      </div>

      <div class="pv-actions">
        <button id="pv-save" class="btn btn-primary" type="button">保存</button>
        <button id="pv-copy" class="btn" type="button">复制</button>
        <button id="pv-pin" class="btn" type="button">钉屏</button>
        <button id="pv-ocr" class="btn" type="button">识别文字</button>
      </div>

      <div id="pv-msg" class="pv-msg"></div>

      <div id="pv-ocr-box" class="pv-ocr" hidden>
        <div class="pv-ocr-head">
          <span>识别结果</span>
          <div class="pv-ocr-acts">
            <button id="pv-translate" class="btn btn-ghost ico-btn" type="button" title="翻译识别结果"></button>
            <button id="pv-copy-text" class="btn btn-ghost ico-btn" type="button" title="复制文字"></button>
          </div>
        </div>
        <pre id="pv-ocr-text"></pre>
      </div>
    </aside>
  </main>
</div>

<script src="contextmenu.js"></script>
<script src="theme.js"></script>
<script src="icons.js"></script>
<script src="annot_editor.js"></script>
<script src="titlebar.js"></script>
<script src="preview.js"></script>
<script>TitleBar.mount();</script>
</body>
</html>
