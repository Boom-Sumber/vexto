<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>LightBox 下载</title>
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="theme-dark.css" />
<link rel="stylesheet" href="base.css" />
<link rel="stylesheet" href="main.css" />
</head>
<body data-theme="dark">
<div class="win">
  <!-- 自绘标题栏：图标与按钮行为由 titlebar.js 注入 -->
  <header class="tb" data-tauri-drag-region>
    <span class="tb-title" data-tauri-drag-region>任务列表</span>
    <div class="tb-actions">
      <button class="tb-btn" type="button" data-win="min"></button>
      <button class="tb-btn" type="button" data-win="max"></button>
      <button class="tb-btn close" type="button" data-win="close"></button>
    </div>
  </header>

  <div class="app">
    <aside class="side">
      <!-- 视图切换：下载任务列表 / 局域网互传（S4b）。互传停用时隐藏「互传」。 -->
      <div class="view-switch">
        <button class="vbtn active" type="button" data-view="download">下载</button>
        <button class="vbtn" type="button" data-view="transfer">互传</button>
      </div>
      <div class="side-title">分类</div>
      <nav class="cats">
        <button class="cat active" type="button" data-cat="all">全部 <span id="c-all">0</span></button>
        <button class="cat" type="button" data-cat="running">进行中 <span id="c-running">0</span></button>
        <button class="cat" type="button" data-cat="failed">失败 <span id="c-failed">0</span></button>
        <button class="cat" type="button" data-cat="complete">已完成 <span id="c-complete">0</span></button>
        <button class="cat" type="button" data-cat="deleted">已删除 <span id="c-deleted">0</span></button>
      </nav>
    </aside>

    <div class="main">
      <header class="head">
        <h1 id="title">全部</h1>
        <div class="tools">
          <button id="newTask" class="btn btn-primary" type="button">新建</button>
          <button id="clear" class="btn" type="button">清空已完成</button>
        </div>
      </header>

      <div id="error" class="notice notice-danger error hidden"></div>

      <main id="list" class="list"></main>
      <div id="empty" class="empty">
        还没有下载任务。<br />按下载热键，或点右上角「新建」开始。
      </div>

      <footer class="foot">
        <span id="global" class="num">↓ 0 B/s　↑ 0 B/s</span>
        <span id="counts" class="num">0 个任务 · 0 个活动</span>
      </footer>
    </div>

    <!-- 局域网互传视图（S4b）：设备列表 + 待确认请求 + 传输进度 -->
    <div id="transferView" class="main hidden">
      <header class="head">
        <h1>局域网互传</h1>
        <div class="tools">
          <button id="tfRefresh" class="btn" type="button">刷新</button>
          <button id="tfPick" class="btn btn-primary" type="button">选择文件发送</button>
        </div>
      </header>

      <div id="tfDropBar" class="tf-dropbar hidden">
        <span id="tfDropInfo"></span>
        <select id="tfDropTarget" class="input"></select>
        <button id="tfDropSend" class="btn btn-primary" type="button">发送</button>
        <button id="tfDropClear" class="btn" type="button">取消</button>
      </div>

      <div id="tfNotice" class="notice hidden"></div>

      <section class="tf-sec">
        <h2 class="tf-h">设备</h2>
        <div id="peerList" class="tf-peers"></div>
        <div id="peerEmpty" class="empty">没有发现设备。确认对方也开着 LocalSend / LightBox，且在同一 WiFi。</div>
      </section>

      <section class="tf-sec" id="tfReqSec">
        <h2 class="tf-h">待确认的接收请求</h2>
        <div id="reqList" class="tf-reqs"></div>
      </section>

      <section class="tf-sec">
        <h2 class="tf-h">传输进度</h2>
        <div id="tfList" class="tf-rows"></div>
        <div id="tfEmpty" class="empty">还没有传输。</div>
      </section>
    </div>
  </div>
</div>

<script src="icons.js"></script>
<script src="controls.js"></script>
<script src="titlebar.js"></script>
<script src="main.js"></script>
<script>TitleBar.mount();</script>
</body>
</html>
