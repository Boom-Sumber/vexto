<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>LightBox 下载</title>
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="theme-dark.css" />
<link rel="stylesheet" href="base.css" />
<link rel="stylesheet" href="main.css" />
</head>
<body data-theme="dark">
<div class="win">
  <!-- 自绘标题栏：图标与按钮行为由 titlebar.js 注入 -->
  <header class="tb" data-tauri-drag-region>
    <span class="tb-title" data-tauri-drag-region>任务列表</span>
    <div class="tb-actions">
      <button class="tb-btn" type="button" data-win="min"></button>
      <button class="tb-btn" type="button" data-win="max"></button>
      <button class="tb-btn close" type="button" data-win="close"></button>
    </div>
  </header>

  <div class="app">
    <aside class="side">
      <!-- 一级导航：下载任务列表 / 局域网互传（S4b）。互传停用时隐藏「互传」。 -->
      <nav class="nav">
        <button class="nav-item active" type="button" data-view="download">
          <span class="nav-ico" data-icon="download"></span><span>下载</span>
        </button>
        <button class="nav-item" type="button" data-view="transfer">
          <span class="nav-ico" data-icon="transfer"></span><span>互传</span>
        </button>
      </nav>

      <!-- 互传的二级导航：发送 / 接收 -->
      <div class="subnav hidden" id="subTransfer">
        <button class="sub-item active" type="button" data-sub="send">发送</button>
        <button class="sub-item" type="button" data-sub="receive">接收</button>
      </div>

      <div class="side-sec" id="catsWrap">
        <div class="side-title">分类</div>
        <nav class="cats">
          <button class="cat active" type="button" data-cat="all">全部 <span id="c-all">0</span></button>
          <button class="cat" type="button" data-cat="running">进行中 <span id="c-running">0</span></button>
          <button class="cat" type="button" data-cat="failed">失败 <span id="c-failed">0</span></button>
          <button class="cat" type="button" data-cat="complete">已完成 <span id="c-complete">0</span></button>
          <button class="cat" type="button" data-cat="deleted">已删除 <span id="c-deleted">0</span></button>
        </nav>
      </div>

      <div class="side-foot">
        <span id="global" class="num">↓ 0 B/s　↑ 0 B/s</span>
      </div>
    </aside>

    <div class="main" id="downloadView">
      <header class="head">
        <h1 id="title">全部</h1>
        <div class="tools">
          <button id="newTask" class="btn btn-primary" type="button">新建</button>
          <button id="clear" class="btn" type="button">清空已完成</button>
        </div>
      </header>

      <div id="error" class="notice notice-danger error hidden"></div>

      <main id="list" class="list"></main>
      <div id="empty" class="empty">
        还没有下载任务。<br />按下载热键，或点右上角「新建」开始。
      </div>

      <footer class="foot">
        <span id="counts" class="num">0 个任务 · 0 个活动</span>
      </footer>
    </div>

    <!-- 局域网互传视图（S4b）：发送 / 接收两个子页 -->
    <div id="transferView" class="main hidden">
      <!-- 发送：选择文件 + 附近设备 + 传输进度 -->
      <div id="paneSend" class="pane">
        <header class="head">
          <h1>局域网互传</h1>
          <div class="tools">
            <button id="tfRefresh" class="btn" type="button">
              <span data-icon="refresh" data-icon-size="14"></span>刷新
            </button>
            <button id="tfPick" class="btn btn-primary" type="button">选择文件发送</button>
          </div>
        </header>

        <div id="tfDropBar" class="tf-dropbar hidden">
          <span id="tfDropInfo"></span>
          <select id="tfDropTarget" class="input"></select>
          <button id="tfDropSend" class="btn btn-primary" type="button">发送</button>
          <button id="tfDropClear" class="btn" type="button">取消</button>
        </div>

        <div id="tfNotice" class="notice hidden"></div>

        <div class="page-body">
          <div class="section-title">选择发送内容</div>
          <div class="action-cards">
            <button class="action-card" id="tfActionFile" type="button">
              <span class="action-icon" data-icon="file" data-icon-size="20"></span>
              <span class="action-text">文件</span>
            </button>
          </div>
          <div class="action-hint">也可以直接把文件拖进这个窗口。</div>

          <div class="section-title">附近的设备</div>
          <div id="peerList" class="device-list"></div>
          <div id="peerEmpty" class="empty">没有发现设备。确认对方也开着 LocalSend / LightBox，且在同一 WiFi。</div>

          <div class="section-title">传输进度</div>
          <div id="tfList" class="tf-rows"></div>
          <div id="tfEmpty" class="empty">还没有传输。</div>
        </div>
      </div>

      <!-- 接收：本机信息 + 待确认请求 -->
      <div id="paneReceive" class="pane hidden">
        <header class="head">
          <h1>接收文件</h1>
          <div class="tools">
            <button id="tfRefreshRecv" class="btn" type="button">
              <span data-icon="refresh" data-icon-size="14"></span>刷新
            </button>
          </div>
        </header>

        <div class="page-body">
          <div class="local-card">
            <div class="local-name" id="localAlias">—</div>
            <div class="local-meta" id="localStatus">—</div>
            <div class="local-path">
              <span class="path-text" id="localDir">—</span>
              <button id="tfOpenDir" class="icon-btn" type="button" title="打开接收目录"
                      aria-label="打开接收目录"></button>
            </div>
          </div>

          <div class="section-title">待确认的接收请求</div>
          <div id="reqList" class="tf-reqs"></div>
          <div id="reqEmpty" class="empty">没有待确认的请求。</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="icons.js"></script>
<script src="controls.js"></script>
<script src="titlebar.js"></script>
<script src="main.js"></script>
<script>TitleBar.mount();</script>
</body>
</html>
