<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>LightBox 设置</title>
<link rel="stylesheet" href="settings.css" />
</head>
<body>
  <h1>划词翻译</h1>
  <p class="hint">密钥只保存在本机 <code id="cfgpath">%APPDATA%\lightbox\config.json</code>，不会上传。</p>

  <div id="tool-status" class="tool-status hidden"></div>

  <label>百度翻译 APPID
    <input id="appid" type="text" placeholder="开发者信息页里的「APP ID」" autocomplete="off" spellcheck="false" />
  </label>

  <label>百度翻译密钥
    <input id="secret" type="password" placeholder="开发者信息页里的「密钥」" autocomplete="off" spellcheck="false" />
  </label>

  <label>全局热键
    <input id="hotkey" type="text" class="capture" readonly placeholder="点击设置" spellcheck="false" />
  </label>
  <p class="hint">点击输入框后直接按组合键：修饰键只能是 <b>Ctrl / Shift / Alt</b>（1–2 个），主键只能是 <b>0-9</b>、<b>A-Z</b>、<b>F1-F12</b>。按 Esc 取消。</p>

  <div class="buttons">
    <button id="save" class="primary">保存并生效</button>
    <span id="status"></span>
  </div>

  <script src="settings.js"></script>
</body>
</html>
