<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>滚动截图</title>
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="theme-dark.css" />
<link rel="stylesheet" href="theme-light.css" />
<link rel="stylesheet" href="base.css" />
<link rel="stylesheet" href="region_select.css" />
</head>
<body data-theme="dark" data-purpose="scroll">
  <img id="snap" class="snap" alt="" draggable="false" />
  <div id="hit"></div>
  <div id="dim"></div>
  <div id="box">
    <img id="result" class="result-img" alt="" draggable="false" />
    <span class="h h-tl"></span><span class="h h-tc"></span><span class="h h-tr"></span>
    <span class="h h-ml"></span><span class="h h-mr"></span>
    <span class="h h-bl"></span><span class="h h-bc"></span><span class="h h-br"></span>
  </div>

  <div id="magnifier">
    <canvas id="mag-canvas" width="128" height="128"></canvas>
    <div class="mag-info">
      <div class="mag-row"><span class="mag-label">坐标</span><span class="mag-value" id="mag-pos">0, 0</span></div>
      <div class="mag-row"><span class="mag-label">色值</span><span class="mag-value mag-color"><i id="mag-swatch"></i><span id="mag-hex">#000000</span></span></div>
      <div class="mag-hint" id="mag-hint">按 Ctrl+C 复制色值</div>
    </div>
  </div>

  <div id="toolbar">
    <button class="tb-btn" type="button" data-act="save_as" title="另存为">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v3h16v-3"/></svg>
    </button>
    <button class="tb-btn" type="button" data-act="clipboard" title="复制图片">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 011-1h10"/></svg>
    </button>
    <button class="tb-btn" type="button" data-act="path" title="保存并复制路径">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007.5.5l2-2a5 5 0 00-7-7l-1 1"/><path d="M14 11a5 5 0 00-7.5-.5l-2 2a5 5 0 007 7l1-1"/></svg>
    </button>
    <button class="tb-btn" type="button" data-act="pin" title="钉屏">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M8 3h8l-1 6 3 3v2H6v-2l3-3-1-6z"/></svg>
    </button>
    <button class="tb-btn" type="button" data-act="preview" title="预览">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/></svg>
    </button>
    <span class="tb-sep"></span>
    <button class="tb-btn tb-ok" type="button" data-act="default" title="完成">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
    </button>
    <button class="tb-btn tb-close" type="button" data-act="close" title="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- 与 OCR / 截图共用 region_select.js 的 DOM 契约；滚动模式不会用到卡片。 -->
  <div id="card">
    <div id="card-tag" class="card-tag"></div>
    <div id="card-original" class="original"></div>
    <div id="card-text" class="translated"></div>
    <div id="shotPath" class="shot-path" style="display:none"></div>
    <div id="card-acts" class="card-acts">
      <button id="copyBtn" class="btn" type="button">复制译文</button>
      <button id="closeBtn" class="btn btn-primary" type="button">关闭</button>
    </div>
  </div>

<script src="contextmenu.js"></script>
<script src="theme.js"></script>
<script src="icons.js"></script>
<script src="region_select.js"></script>
</body>
</html>
